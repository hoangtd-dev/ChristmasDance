<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Song</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --text:#f2f4f8; --muted:#8b93a1; --accent:#ff5a5f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:20px 0 4px; }
  .now { color:var(--muted); font-size:14px; margin:0 0 14px; min-height:20px; }
  .player { position:relative; aspect-ratio:16/9; background:#000; border-radius:14px; overflow:hidden; }
  .player > div, .player iframe { position:absolute; inset:0; width:100%; height:100%; }
  .progress { height:4px; background:#2a2e38; border-radius:2px; margin:12px 0 20px; overflow:hidden; }
  .progress i { display:block; height:100%; width:0; background:var(--accent); }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  button { width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px; background:var(--card); color:inherit; border:2px solid transparent; border-radius:12px; font:inherit; font-size:16px; text-align:left; cursor:pointer; }
  button:active { transform:scale(.98); }
  button.active { border-color:var(--accent); }
  .time { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .done { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>🎄 Christmas Song</h1>
  <p class="now" id="now">Chọn một đoạn để xem</p>
  <div class="player"><div id="yt"></div></div>
  <div class="progress"><i id="bar"></i></div>
  <ul id="list"></ul>
</main>

<script src="segments.js"></script>
<script>
  const { videoId, segments } = window.CONFIG;
  const $ = id => document.getElementById(id);
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  let player, current = -1, timer;

  // Danh sách đoạn
  segments.forEach((seg, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<button type="button"><span>${seg.title}</span><span class="time">${fmt(seg.start)} – ${fmt(seg.end)}</span></button>`;
    li.firstChild.onclick = () => play(i);
    $("list").appendChild(li);
  });

  function mark() {
    [...$("list").children].forEach((li, i) => li.firstChild.classList.toggle("active", i === current));
  }

  function play(i) {
    current = i;
    const { title, start } = segments[i];
    $("now").textContent = `Đang phát: ${title}`;
    $("now").classList.remove("done");
    mark();
    player.loadVideoById({ videoId, startSeconds: start });
    clearInterval(timer);
    timer = setInterval(tick, 250);
  }

  function tick() {
    const { start, end } = segments[current];
    const t = player.getCurrentTime();
    $("bar").style.width = Math.min(100, Math.max(0, (t - start) / (end - start) * 100)) + "%";
    if (t >= end) {
      player.pauseVideo();
      clearInterval(timer);
      $("bar").style.width = "100%";
      $("now").textContent = "Xong rồi! Chọn đoạn tiếp theo 👇";
      $("now").classList.add("done");
    }
  }

  // YouTube IFrame API
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("yt", {
      videoId,
      playerVars: { rel: 0, playsinline: 1 },
    });
  };
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
</script>
</body>
</html>
